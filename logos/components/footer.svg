<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1600"
    height="240"
    viewBox="0 0 1600 240"
    role="img"
    aria-labelledby="title desc">

    <title id="title">The Lupaxa Project Footer</title>
    <desc id="desc">
        Standard footer used across The Lupaxa Project repositories.
        Matches the portal footer: brand blue field, soft top rule, centred
        copyright and taglines at the same type size.
    </desc>

    <!-- Transparent space (20px) above the footer -->

    <!-- Background -->
    <rect
        x="0"
        y="20"
        width="1600"
        height="220"
        fill="#203959" />

    <!-- Soft top rule (site footer uses ~12% white on brand blue) -->
    <rect
        x="0"
        y="20"
        width="1600"
        height="2"
        fill="#FFFFFF"
        fill-opacity="0.12" />

    <!-- Brand accent border -->
    <rect
        x="1"
        y="21"
        width="1598"
        height="218"
        fill="none"
        stroke="#6D95D3"
        stroke-width="2" />

    <!--
      Type size matches the portal: copyright and taglines share one size;
      hierarchy comes from weight / opacity only.
    -->
    <text
        x="800"
        y="98"
        text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="26"
        font-weight="600"
        letter-spacing="-0.4"
        fill="#FFFFFF"
        fill-opacity="0.9">
        © 2025-2026 <tspan font-weight="700">The Lupaxa Project</tspan>. All rights reserved.
    </text>

    <text
        x="800"
        y="140"
        text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="26"
        font-weight="300"
        fill="#FFFFFF">
        Where exploration meets precision.
    </text>

    <text
        x="800"
        y="178"
        text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="26"
        font-weight="300"
        fill="#FFFFFF">
        Where the untamed meets the engineered.
    </text>

</svg>
