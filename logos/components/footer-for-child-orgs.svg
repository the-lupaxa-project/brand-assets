<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1600"
    height="280"
    viewBox="0 0 1600 280"
    role="img"
    aria-labelledby="title desc">

    <title id="title">The Lupaxa Project Child Organisation Footer</title>
    <desc id="desc">
        Footer for organisations that form part of The Lupaxa Project.
        Matches the portal footer styling, with a PART OF eyebrow.
    </desc>

    <!-- Transparent space (20px) above the footer -->

    <!-- Background -->
    <rect
        x="0"
        y="20"
        width="1600"
        height="260"
        fill="#203959" />

    <!-- Soft top rule -->
    <rect
        x="0"
        y="20"
        width="1600"
        height="2"
        fill="#FFFFFF"
        fill-opacity="0.12" />

    <!-- Brand accent border -->
    <rect
        x="1"
        y="21"
        width="1598"
        height="258"
        fill="none"
        stroke="#6D95D3"
        stroke-width="2" />

    <!-- Part of -->
    <text
        x="800"
        y="72"
        text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="15"
        font-weight="600"
        letter-spacing="3"
        fill="#6D95D3">
        PART OF
    </text>

    <text
        x="800"
        y="122"
        text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="26"
        font-weight="600"
        letter-spacing="-0.4"
        fill="#FFFFFF"
        fill-opacity="0.9">
        © 2025-2026 <tspan font-weight="700">The Lupaxa Project</tspan>. All rights reserved.
    </text>

    <text
        x="800"
        y="164"
        text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="26"
        font-weight="300"
        fill="#FFFFFF">
        Where exploration meets precision.
    </text>

    <text
        x="800"
        y="202"
        text-anchor="middle"
        font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="26"
        font-weight="300"
        fill="#FFFFFF">
        Where the untamed meets the engineered.
    </text>

</svg>
